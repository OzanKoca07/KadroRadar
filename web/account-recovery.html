<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>KadroRadar hesap işlemi</title><link rel="stylesheet" href="/account-recovery.css"></head><body><main><h1>KadroRadar</h1><h2 id="title">Hesap işlemi</h2><p id="message" role="status">Bağlantı kontrol ediliyor.</p><form id="form" hidden><label id="password-label" hidden>Yeni şifre (12–128 karakter)<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><button id="submit" type="submit">Onayla</button></form><p id="verify-hint" hidden>Yeni doğrulama bağlantısını uygulamada Profil → Doğrulama bağlantısı iste yoluyla alabilirsin.</p><p id="request-link"><a href="/account-recovery">Yeni parola sıfırlama bağlantısı iste</a></p><form id="request" hidden><label>E-posta<input id="email" type="email" required maxlength="254" autocomplete="email"></label><button type="submit">Parola sıfırlama bağlantısı iste</button></form><p>İşlemden sonra uygulamaya dönüp giriş yapabilirsin. KadroRadar bağımsız bir ilan takip platformudur.</p></main><script src="/account-recovery.js"></script></body></html>
